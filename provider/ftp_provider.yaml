identity:
  author: ryantsai
  name: ftp_provider
  description:
    en_US: FTP/SFTP/FTPS storage provider
    zh_Hans: FTP/SFTP/FTPS 存储提供商
  icon: icon.svg
  label:
    en_US: FTP Provider
    zh_Hans: FTP 提供商
  tags: []

credentials_schema:
  - name: host
    type: text-input
    required: true
    label:
      en_US: Host
      zh_Hans: 主机
    placeholder:
      en_US: FTP server host (e.g., ftp.example.com)
      zh_Hans: FTP 服务器主机（例如：ftp.example.com）
  - name: username
    type: text-input
    required: true
    label:
      en_US: Username
      zh_Hans: 用户名
  - name: password
    type: secret-input
    required: true
    label:
      en_US: Password
      zh_Hans: 密码

provider_type: online_drive

datasources:
  - datasources/ftp_datasource.yaml

extra:
  python:
    source: provider/ftp_provider.py
